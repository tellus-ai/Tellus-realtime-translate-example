name: tellus_flutter_example
description: Tellus realtime translation example for Flutter (iOS and Android).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.2.0
  # `npm run setup` prepares the pinned public SDK in .sdk/ (scripts/prepare-sdk.mjs).
  tellus_audio_sdk:
    path: .sdk/platforms/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The unit tests run timers and retries on a fake clock. flutter_test already brings this package.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
